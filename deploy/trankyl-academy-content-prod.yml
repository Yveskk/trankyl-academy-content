version: "3.8"

services:
  trankyl_academy_content_prod:
    container_name: trankyl_academy_content_prod
    image: trankyldev/trankyl_academy_content_prod:latest
    restart: always
    env_file:
      - .env.prod
    environment:
      - PORT=3000
    ports:
      - "9004:3000"
    networks:
      e_global:
        aliases:
          - trankyl_academy_content_prod

networks:
  e_global:
    external: true
